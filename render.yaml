services:
  # The Backend Service (FastAPI)
  - type: web
    name: nexus-research-backend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # You will set this manually in the Render Dashboard (Neon DB URL)
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: TAVILY_API_KEY
        sync: false # Set in Render Dashboard
      - key: JINA_API_KEY
        sync: false # Set in Render Dashboard
      - key: ENCRYPTION_KEY
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard
      - key: FRONTEND_URL
        sync: false # Set this in Render Dashboard to your Vercel deployment URL (e.g., https://my-app.vercel.app)
      - key: PYTHON_VERSION
        value: 3.11.0
